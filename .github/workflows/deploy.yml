name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Publish the standalone param8 Editor as the embedded app.
      # The /editor/ URL itself is the Astro page containing the iframe.
      - name: Add param8 Editor app
        run: |
          git clone --depth 1 https://github.com/KBLiveSolutions/param8-editor.git ../param8-editor
          rm -rf ./dist/editor-app
          mkdir -p ./dist/editor-app
          cp -R ../param8-editor/public/. ./dist/editor-app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
